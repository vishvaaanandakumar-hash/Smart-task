services:
  - type: web
    name: smarttask-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://smart-task-brown.vercel.app
      - key: DATABASE_URL
        sync: false
